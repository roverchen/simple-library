<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幼兒園圖書管理系統 Pro</title>
    <link rel="icon" href="data:,">
    <script src="vendor/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary: #4CAF50;
            --secondary: #2196F3;
            --danger: #f44336;
            --dark: #333;
            --bg: #f4f7f6;
        }
        * { box-sizing: border-box; }
        body { font-family: "微軟正黑體", sans-serif; background-color: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 800px; margin: 10px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* 導覽列 */
        .nav { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .nav button { flex: 1; background: #eee; border: none; padding: 12px; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .nav button.active { background: var(--secondary); color: white; }

        .page { display: none; }
        .page.active { display: block; }

        /* 相機容器 */
        #reader-wrapper { display: none; margin: 20px 0; text-align: center; }
        #reader { width: 100%; max-width: 450px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 5px solid #ccc; }

        /* 按鈕樣式 */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0; }
        .btn-main { padding: 20px; border: none; border-radius: 10px; color: white; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
        .btn-borrow { background-color: var(--primary); }
        .btn-return { background-color: var(--secondary); }
        .btn-add-book { background-color: var(--dark); grid-column: span 2; }
        .btn-cancel { background-color: #666; width: 100%; margin-top: 15px; padding: 15px; border: none; border-radius: 10px; color: white; font-weight: bold; }

        /* 忘記密碼／救援 modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; padding: 14px; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: #fff; border-radius: 12px; padding: 18px; width: 100%; max-width: 420px; max-height: 92vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
        .modal-box h3 { margin: 0; }
        .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #666; line-height: 1; }
        .modal-tabs { display: flex; gap: 8px; margin: 12px 0; }
        .modal-tabs button { flex: 1; padding: 10px; border: 1px solid #ddd; background: #f7f7f7; border-radius: 8px; cursor: pointer; font-weight: bold; color: #555; }
        .modal-tabs button.active { background: var(--secondary); border-color: var(--secondary); color: #fff; }
        .modal-box label { display: block; margin: 10px 0 6px; font-weight: bold; font-size: .9rem; }
        .modal-box textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; font-family: inherit; resize: vertical; }
        .modal-box input[readonly] { background: #f5f5f5; font-family: monospace; letter-spacing: .04em; }
        .modal-box .btn-primary { width: 100%; margin-top: 14px; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .modal-box .btn-secondary { width: 100%; margin-top: 8px; padding: 10px; background: #eee; color: #444; border: none; border-radius: 8px; cursor: pointer; }
        .modal-hint { color: #666; font-size: .82rem; line-height: 1.6; white-space: pre-line; }
        .modal-error { color: #c62828; font-size: .88rem; line-height: 1.5; min-height: 1.2em; }

        .input-group { margin: 15px 0; display: flex; flex-direction: column; gap: 10px; }
        input, select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }

        /* 紀錄與列表 */
        .log-item { padding: 15px; margin-bottom: 8px; border-radius: 8px; background: #fff; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .log-info { display: flex; flex-direction: column; gap: 2px; }
        .log-unit { font-size: 0.85rem; color: #666; }
        
        /* 表格優化 */
        .table-container { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        .btn-edit { color: var(--secondary); border: 1px solid var(--secondary); background: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-del { color: var(--danger); border: 1px solid var(--danger); background: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        .btn-restore { color: var(--primary); border: 1px solid var(--primary); background: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }

        /* 狀態標記 */
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: bold; color: white; }
        .badge-scrap { background-color: var(--danger); }
        .badge-loaned { background-color: var(--warning); }
        .badge-in { background-color: var(--primary); }

        @media (min-width: 600px) { .input-group { flex-direction: row; } }
    </style>
</head>
<body>

<div class="container">
    <div id="loginPage" class="page active" style="max-width: 360px; margin: 40px auto;">
        <h3 style="text-align:center;">🔐 幼兒園圖書系統</h3>
        <div class="input-group" style="flex-direction: column;">
            <input type="text" id="loginUsername" placeholder="帳號／姓名／Email" autocomplete="username">
            <input type="password" id="loginPwd" placeholder="密碼" autocomplete="current-password">
            <button onclick="handleLogin()" class="btn-main btn-borrow" style="padding: 14px;">登入</button>
            <button onclick="openForgotModal()" style="background:#666; color:white; padding:10px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">🔑 忘記密碼？</button>
        </div>
        <p id="loginError" style="color:#c62828; line-height:1.6;"></p>
    </div>

    <div class="nav" id="mainNav" style="display: none;">
        <button onclick="changeTab('loanPage')" id="btn-loanPage" class="active">📖 借還書</button>
        <button onclick="changeTab('managePage')" id="btn-managePage">⚙️ 圖書管理</button>
        <button onclick="changeTab('reportPage')" id="btn-reportPage">📊 報表</button>
        <button onclick="handleLogout()">🚪 登出</button>
    </div>

    <div id="loanPage" class="page">
        <div class="input-group">
            <select id="borrowerUnit">
                <option value="班級">🏫 班級</option>
                <option value="家庭">🏠 家庭</option>
            </select>
            <input type="text" id="unitName" placeholder="輸入名稱 (如: 小熊班)">
            <select id="borrowerType">
                <option value="student">🎒 學生</option>
                <option value="teacher">🧑‍🏫 老師</option>
            </select>
        </div>

        <div id="loanActionGrid" class="action-grid">
            <button onclick="initiateScan('borrow')" class="btn-main btn-borrow"><span>📤</span> 借書</button>
            <button onclick="initiateScan('return')" class="btn-main btn-return"><span>📥</span> 還書</button>
        </div>

        <div id="reader-wrapper">
            <h3 id="scanModeTitle">準備掃描...</h3>
            <div id="reader"></div>
            <p style="color: #666; font-size: 0.9rem;">提示：請將條碼水平置於框內，保持約 15 公分距離。</p>
            <button onclick="stopScanner()" class="btn-cancel">❌ 取消並返回</button>
        </div>

        <div id="logList" style="margin-top: 20px;"></div>
    </div>

    <div id="managePage" class="page">
        <div id="manageActionGrid" class="action-grid">
            <button onclick="initiateScan('manage')" class="btn-main btn-add-book"><span>🔍</span> 掃描新增/修改圖書</button>
        </div>

        <div class="table-container">
            <h3>目前館藏列表</h3>
            <table id="bookTable">
                <thead><tr><th>書名</th><th style="text-align:right;">管理操作</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="reportPage" class="page">
        <h3>📊 借閱統計</h3>
        <div class="table-container">
            <table id="statTable">
                <thead><tr><th>書名</th><th>狀態</th><th>次數</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 忘記密碼／救援 modal -->
<div class="modal-overlay" id="forgotModal">
    <div class="modal-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>🔑 忘記密碼</h3>
            <button type="button" class="modal-close" onclick="closeForgotModal()" aria-label="關閉">✕</button>
        </div>
        <p class="modal-hint">共用管理員（帳號留空登入）請將帳號欄位留空。</p>
        <div class="modal-tabs">
            <button type="button" id="tabEmail" class="active" onclick="switchRecoveryTab('email')">Email 驗證碼</button>
            <button type="button" id="tabCode" onclick="switchRecoveryTab('code')">本機復原碼</button>
        </div>
        <div id="recoveryEmailPane">
            <div id="emailStep1">
                <label for="recoveryUsername">帳號／姓名／Email（共用管理員請留空）</label>
                <input type="text" id="recoveryUsername" autocomplete="username">
                <button type="button" class="btn-primary" onclick="requestRecoveryCode()">📧 寄送驗證碼</button>
                <p class="modal-hint" id="recoveryEmailHint"></p>
            </div>
            <div id="emailStep2" style="display:none;">
                <p class="modal-hint" id="recoverySentInfo"></p>
                <label for="recoveryCodeInput">6 位數驗證碼</label>
                <input type="text" id="recoveryCodeInput" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
                <label for="recoveryNewPwd">新密碼（至少 4 碼）</label>
                <input type="password" id="recoveryNewPwd" autocomplete="new-password">
                <label for="recoveryNewPwd2">再次輸入新密碼</label>
                <input type="password" id="recoveryNewPwd2" autocomplete="new-password">
                <button type="button" class="btn-primary" onclick="verifyRecoveryCode()">✅ 重設密碼</button>
                <button type="button" class="btn-secondary" onclick="backToEmailStep1()">← 返回</button>
            </div>
        </div>
        <div id="recoveryCodePane" style="display:none;">
            <p class="modal-hint">請在伺服器主機開啟 <code>data/recovery_code.txt</code>，輸入裡面的復原碼。此方式只能重設共用管理員密碼。</p>
            <label for="localRecoveryCode">本機復原碼</label>
            <input type="text" id="localRecoveryCode" autocomplete="off">
            <label for="localNewPwd">新密碼（至少 4 碼）</label>
            <input type="password" id="localNewPwd" autocomplete="new-password">
            <label for="localNewPwd2">再次輸入新密碼</label>
            <input type="password" id="localNewPwd2" autocomplete="new-password">
            <button type="button" class="btn-primary" onclick="submitLocalRecovery()">✅ 重設密碼</button>
        </div>
        <p class="modal-error" id="recoveryError"></p>
    </div>
</div>

<!-- 通用輸入對話框（取代 prompt） -->
<div class="modal-overlay" id="inputDialog">
    <div class="modal-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 id="inputDialogTitle">請輸入</h3>
            <button type="button" class="modal-close" onclick="closeInputDialog(null)" aria-label="關閉">✕</button>
        </div>
        <p class="modal-hint" id="inputDialogMessage" style="display:none;"></p>
        <div id="inputDialogFields"></div>
        <p class="modal-error" id="inputDialogError"></p>
        <button type="button" class="btn-primary" id="inputDialogSubmit" onclick="submitInputDialog()">確定</button>
        <button type="button" class="btn-secondary" onclick="closeInputDialog(null)">取消</button>
    </div>
</div>

<script>
    // 資料以伺服器端的 SQLite 為準
    let bookDatabase = {};
    let html5QrCode;
    let currentMode = '';
    let scanQueue = Promise.resolve();

    // --- 後端 API 與登入 ---
    async function api(method, path, body) {
        const opts = { method, credentials: 'same-origin', headers: {} };
        if (body !== undefined) {
            opts.headers['Content-Type'] = 'application/json';
            opts.body = JSON.stringify(body);
        }
        const res = await fetch(path, opts).catch(() => {
            throw new Error('無法連線到後端，請確認伺服器已啟動');
        });
        const text = await res.text();
        let data = null;
        if (text) { try { data = JSON.parse(text); } catch (_) { /* 非 JSON */ } }
        if (!res.ok) {
            if (res.status === 401 && !path.endsWith('/login')) showLogin();
            const err = new Error((data && data.error) || `HTTP ${res.status}`);
            err.status = res.status;
            err.data = data;
            throw err;
        }
        return data;
    }

    function applyState(state) {
        bookDatabase = state.bookDB || {};
    }

    function showLogin() {
        if (html5QrCode) stopScanner();
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('loginPage').classList.add('active');
        document.getElementById('mainNav').style.display = 'none';
    }

    function showApp() {
        document.getElementById('loginPage').classList.remove('active');
        document.getElementById('mainNav').style.display = 'flex';
        changeTab('loanPage');
    }

    async function bootstrap() {
        try {
            const session = await api('GET', '/api/session');
            if (!session.authenticated) return;
            const state = await api('GET', '/api/state');
            applyState(state);
            showApp();
        } catch (err) {
            if (err.status !== 401) {
                document.getElementById('loginError').textContent =
                    '無法連線到後端：' + err.message + '（請確認已執行 python3 server.py）';
            }
        }
    }

    async function handleLogin() {
        const pwd = document.getElementById('loginPwd').value;
        const uname = (document.getElementById('loginUsername') || {}).value || '';
        const errorEl = document.getElementById('loginError');
        errorEl.textContent = '';
        try {
            await api('POST', '/api/login', { username: uname, password: pwd });
            const state = await api('GET', '/api/state');
            applyState(state);
            document.getElementById('loginPwd').value = '';
            showApp();
        } catch (err) {
            errorEl.textContent = err.message || '密碼錯誤';
        }
    }

    async function handleLogout() {
        try { await api('POST', '/api/logout'); } catch (_) { /* 忽略 */ }
        location.reload();
    }

    // --- 忘記密碼／救援 ---
    function openForgotModal() {
        document.getElementById('recoveryError').textContent = '';
        document.getElementById('recoveryUsername').value = '';
        document.getElementById('recoveryCodeInput').value = '';
        document.getElementById('recoveryNewPwd').value = '';
        document.getElementById('recoveryNewPwd2').value = '';
        document.getElementById('localRecoveryCode').value = '';
        document.getElementById('localNewPwd').value = '';
        document.getElementById('localNewPwd2').value = '';
        document.getElementById('emailStep1').style.display = 'block';
        document.getElementById('emailStep2').style.display = 'none';
        switchRecoveryTab('email');
        document.getElementById('forgotModal').classList.add('open');
    }

    function closeForgotModal() {
        document.getElementById('forgotModal').classList.remove('open');
    }

    function switchRecoveryTab(tab) {
        document.getElementById('recoveryError').textContent = '';
        const email = tab === 'email';
        document.getElementById('tabEmail').classList.toggle('active', email);
        document.getElementById('tabCode').classList.toggle('active', !email);
        document.getElementById('recoveryEmailPane').style.display = email ? 'block' : 'none';
        document.getElementById('recoveryCodePane').style.display = email ? 'none' : 'block';
    }

    function setRecoveryError(message) {
        document.getElementById('recoveryError').textContent = message || '';
    }

    async function requestRecoveryCode() {
        setRecoveryError('');
        const username = document.getElementById('recoveryUsername').value.trim();
        try {
            const info = await api('GET', '/api/password/recovery-info?username=' + encodeURIComponent(username));
            if (!info.hasEmail) {
                setRecoveryError('此帳號沒有可用的救援 Email，請聯絡管理員或改用本機復原碼。');
                return;
            }
            if (!info.smtpConfigured) {
                setRecoveryError('系統尚未設定 SMTP，請聯絡管理員或改用本機復原碼。');
                return;
            }
            const res = await api('POST', '/api/password/forgot/request', { username });
            document.getElementById('emailStep1').style.display = 'none';
            document.getElementById('emailStep2').style.display = 'block';
            document.getElementById('recoverySentInfo').textContent =
                `驗證碼已寄到 ${res.maskedEmail || info.maskedEmail}，10 分鐘內有效。`;
        } catch (err) {
            setRecoveryError(err.message || '寄送失敗');
        }
    }

    function backToEmailStep1() {
        setRecoveryError('');
        document.getElementById('emailStep2').style.display = 'none';
        document.getElementById('emailStep1').style.display = 'block';
    }

    async function verifyRecoveryCode() {
        setRecoveryError('');
        const username = document.getElementById('recoveryUsername').value.trim();
        const code = document.getElementById('recoveryCodeInput').value.trim();
        const pwd = document.getElementById('recoveryNewPwd').value;
        const pwd2 = document.getElementById('recoveryNewPwd2').value;
        if (!/^\d{6}$/.test(code)) { setRecoveryError('請輸入 6 位數驗證碼'); return; }
        if (pwd.length < 4) { setRecoveryError('新密碼至少需 4 個字元'); return; }
        if (pwd !== pwd2) { setRecoveryError('兩次輸入的新密碼不一致'); return; }
        try {
            await api('POST', '/api/password/forgot/verify', { username, code, newPassword: pwd });
            alert('✅ 密碼已重設，請使用新密碼登入');
            closeForgotModal();
            document.getElementById('loginPwd').value = '';
        } catch (err) {
            setRecoveryError(err.message || '重設失敗');
        }
    }

    async function submitLocalRecovery() {
        setRecoveryError('');
        const code = document.getElementById('localRecoveryCode').value.trim();
        const pwd = document.getElementById('localNewPwd').value;
        const pwd2 = document.getElementById('localNewPwd2').value;
        if (!code) { setRecoveryError('請輸入本機復原碼'); return; }
        if (pwd.length < 4) { setRecoveryError('新密碼至少需 4 個字元'); return; }
        if (pwd !== pwd2) { setRecoveryError('兩次輸入的新密碼不一致'); return; }
        try {
            await api('POST', '/api/password/recovery-code', { code, newPassword: pwd });
            alert('✅ 密碼已重設，請使用新密碼登入');
            closeForgotModal();
            document.getElementById('loginPwd').value = '';
        } catch (err) {
            setRecoveryError(err.message || '重設失敗');
        }
    }

    // --- 通用輸入對話框（取代 prompt） ---
    let inputDialogState = null;

    function showInputDialog(options) {
        return new Promise(function (resolve) {
            const fields = options.fields || [];
            inputDialogState = { resolve: resolve, validate: options.validate || null };
            document.getElementById('inputDialogTitle').textContent = options.title || '請輸入';
            const message = document.getElementById('inputDialogMessage');
            message.textContent = options.message || '';
            message.style.display = options.message ? 'block' : 'none';
            document.getElementById('inputDialogSubmit').textContent = options.submitText || '確定';
            document.getElementById('inputDialogError').textContent = '';
            const container = document.getElementById('inputDialogFields');
            container.innerHTML = fields.map(function (field, index) {
                const id = 'inputDialogField' + index;
                const name = escapeHtml(field.name || 'value');
                const placeholder = escapeHtml(field.placeholder || '');
                let control;
                if (field.type === 'textarea') {
                    control = `<textarea id="${id}" data-name="${name}" rows="4" placeholder="${placeholder}">${escapeHtml(field.value || '')}</textarea>`;
                } else {
                    const type = field.type || 'text';
                    const readonly = field.readOnly ? ' readonly' : '';
                    control = `<input id="${id}" data-name="${name}" type="${type}" value="${escapeHtml(field.value || '')}" placeholder="${placeholder}"${readonly}>`;
                }
                return `<label for="${id}">${escapeHtml(field.label || '')}</label>${control}`;
            }).join('');
            document.getElementById('inputDialog').classList.add('open');
            setTimeout(function () {
                const first = container.querySelector('input, textarea');
                if (first) {
                    first.focus();
                    if (first.tagName === 'INPUT' && first.type !== 'password') first.select();
                }
            }, 50);
        });
    }

    function submitInputDialog() {
        if (!inputDialogState) return;
        const values = {};
        document.querySelectorAll('#inputDialogFields [data-name]').forEach(function (el) {
            values[el.dataset.name] = el.value;
        });
        if (inputDialogState.validate) {
            const error = inputDialogState.validate(values);
            if (error) {
                document.getElementById('inputDialogError').textContent = error;
                return;
            }
        }
        const resolve = inputDialogState.resolve;
        inputDialogState = null;
        document.getElementById('inputDialog').classList.remove('open');
        resolve(values);
    }

    function closeInputDialog(value) {
        document.getElementById('inputDialog').classList.remove('open');
        if (!inputDialogState) return;
        const resolve = inputDialogState.resolve;
        inputDialogState = null;
        resolve(value);
    }

    document.getElementById('inputDialog').addEventListener('click', function (e) {
        if (e.target === this) closeInputDialog(null);
    });
    document.getElementById('inputDialog').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
            e.preventDefault();
            submitInputDialog();
        }
    });

    document.getElementById('forgotModal').addEventListener('click', function (e) {
        if (e.target === this) closeForgotModal();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        if (document.getElementById('inputDialog').classList.contains('open')) {
            closeInputDialog(null);
            return;
        }
        closeForgotModal();
    });

    // 所有使用者輸入的內容在寫入 innerHTML 前都必須經過此轉義
    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // 表格按鈕使用 data-* 屬性 + 事件委派，避免資料字串直接塞進 onclick 引號
    document.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const d = btn.dataset;
        if (d.act === 'edit') manualEdit(d.id);
        else if (d.act === 'scrap') deleteBook(d.id);
        else if (d.act === 'restore') restoreBook(d.id);
    });

    function initiateScan(mode) {
        if (mode !== 'manage') {
            const nameValue = document.getElementById('unitName').value.trim();
            if (!nameValue) return alert("⚠️ 請先輸入名稱！");
        }

        currentMode = mode;
        document.getElementById('loanActionGrid').style.display = 'none';
        document.getElementById('manageActionGrid').style.display = 'none';
        
        const wrapper = document.getElementById('reader-wrapper');
        const activePage = document.querySelector('.page.active');
        activePage.insertBefore(wrapper, activePage.querySelector('.table-container') || activePage.querySelector('#logList'));
        wrapper.style.display = 'block';
        
        const modeTitle = document.getElementById('scanModeTitle');
        if(mode === 'borrow') modeTitle.innerHTML = `<span style="color:var(--primary)">📤 正在借書掃描...</span>`;
        else if(mode === 'return') modeTitle.innerHTML = `<span style="color:var(--secondary)">📥 正在還書掃描...</span>`;
        else modeTitle.innerHTML = `<span style="color:var(--dark)">🔍 掃描條碼以新增或修改...</span>`;

        startScanner();
    }

    function startScanner() {
        html5QrCode = new Html5Qrcode("reader");
    
        const config = { 
            fps: 25,                       
            qrbox: { width: 300, height: 120 }, 
            aspectRatio: 1.0,
            formatsToSupport: [ 
                Html5QrcodeSupportedFormats.EAN_13, 
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.QR_CODE 
            ],
            videoConstraints: {
                facingMode: "environment",
                width: { min: 640, ideal: 1280, max: 1920 },
                height: { min: 480, ideal: 720, max: 1080 }
            }
        };

        html5QrCode.start({ facingMode: "environment" }, config, handleScanSuccess)
        .catch(err => { 
            alert("相機啟動失敗，請確認是否使用 HTTPS 開啟。"); 
            stopScanner(); 
        });
    }

    function handleScanSuccess(barcode) {
        const mode = currentMode;
        scanQueue = scanQueue
            .then(() => processScan(barcode, mode))
            .catch(err => {
                alert('❌ ' + (err.message || '處理失敗'));
                stopScanner();
            });
    }

    async function processScan(barcode, mode) {
        const unitType = document.getElementById('borrowerUnit').value;
        const unitName = document.getElementById('unitName').value.trim();

        if (mode === 'manage') {
            stopScanner();
            await new Promise(resolve => setTimeout(resolve, 300));
            const existing = bookDatabase[barcode] || null;
            const result = await showInputDialog({
                title: existing ? '✏️ 修改圖書' : '➕ 新增圖書',
                message: existing
                    ? `條碼：${barcode}\n目前名稱：${existing.title}`
                    : `發現新條碼：${barcode}`,
                fields: [{ name: 'title', label: '書名', value: existing ? existing.title : '' }],
                submitText: '儲存',
                validate: function (v) {
                    return v.title.trim() ? '' : '書名不可空白';
                }
            });
            if (result !== null) {
                const res = await api('PUT', '/api/books/' + encodeURIComponent(barcode), {
                    title: result.title.trim(),
                    assetId: existing ? (existing.assetId || '') : ''
                });
                bookDatabase[barcode] = res.book;
                renderManageTable();
            }
            return;
        }

        const book = bookDatabase[barcode];
        if (!book) {
            alert(`❌ 找不到此書籍：${barcode}\n請至管理頁面掃描入庫。`);
            stopScanner();
            return;
        }

        if (book.status === "報廢") {
            alert(`⚠️ 《${book.title}》已報廢，不可借還！`);
            return;
        }

        if (!unitName) {
            alert("⚠️ 請先輸入名稱！");
            stopScanner();
            return;
        }

        if (mode === 'borrow' && book.loanedTo) {
            alert(`❌ 《${book.title}》已被 ${book.loanedTo} 借閱中。`);
            return;
        }
        if (mode === 'return' && !book.loanedTo) {
            alert(`❌ 《${book.title}》目前在館內，無需歸還。`);
            return;
        }

        const displayUnit = `${unitType}: ${unitName}`;

        try {
            const res = await api('POST', '/api/loan', {
                barcode,
                className: unitType,
                userName: unitName,
                action: mode === 'borrow' ? '借書' : '還書',
                memberType: (document.getElementById('borrowerType') || {}).value || 'student'
            });
            bookDatabase[barcode] = res.book;
            addLogEntry(res.book.title, displayUnit, mode === 'borrow');
            if (navigator.vibrate) navigator.vibrate(100);
        } catch (err) {
            if (err.data && err.data.book) bookDatabase[barcode] = err.data.book;
            alert('❌ ' + err.message);
        }
        stopScanner();
    }

    function addLogEntry(title, unitInfo, isBorrow) {
        const logItem = document.createElement('div');
        logItem.className = 'log-item';
        const actionText = isBorrow ? '借出' : '歸還';
        const color = isBorrow ? 'var(--primary)' : 'var(--secondary)';
        
        logItem.innerHTML = `
            <div class="log-info">
                <b>${escapeHtml(title)}</b>
                <span class="log-unit">${escapeHtml(unitInfo)}</span>
            </div>
            <div>
                <span style="color:white; background:${color}; padding:4px 10px; border-radius:4px; font-weight:bold;">${actionText}</span>
            </div>
        `;
        const logList = document.getElementById('logList');
        logList.insertBefore(logItem, logList.firstChild);
    }

    function stopScanner() {
        const finish = () => {
            html5QrCode = null;
            document.getElementById('reader-wrapper').style.display = 'none';
            document.getElementById('loanActionGrid').style.display = 'grid';
            document.getElementById('manageActionGrid').style.display = 'grid';
        };
        if (!html5QrCode) { finish(); return; }
        const instance = html5QrCode;
        html5QrCode = null;
        instance.stop().then(finish).catch(finish);
    }

    function changeTab(pageId) {
        if (html5QrCode) stopScanner();
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.getElementById('btn-' + pageId).classList.add('active');
        if(pageId === 'managePage') renderManageTable();
        if(pageId === 'reportPage') renderReportTable();
    }

    function renderManageTable() {
        const tbody = document.querySelector('#bookTable tbody');
        tbody.innerHTML = Object.keys(bookDatabase).map(isbn => {
            const b = bookDatabase[isbn];
            const scrapped = b.status === '報廢';
            const badge = scrapped
                ? '<span class="badge badge-scrap">報廢</span>'
                : (b.loanedTo ? '<span class="badge badge-loaned">借出</span>' : '<span class="badge badge-in">在館</span>');
            const actions = scrapped
                ? `<button class="btn-restore" data-act="restore" data-id="${escapeHtml(isbn)}">取消報廢</button>`
                : `<button class="btn-edit" data-act="edit" data-id="${escapeHtml(isbn)}">修改</button><button class="btn-del" data-act="scrap" data-id="${escapeHtml(isbn)}">報廢</button>`;
            return `<tr>
                <td><b${scrapped ? ' style="color:var(--danger)"' : ''}>${escapeHtml(b.title)}</b><br><small style="color:#666">${badge}${b.loanedTo ? ' - ' + escapeHtml(b.loanedTo) : ''}</small></td>
                <td style="text-align:right;">${actions}</td>
            </tr>`;
        }).join('');
    }

    async function manualEdit(isbn) {
        const book = bookDatabase[isbn];
        const result = await showInputDialog({
            title: '✏️ 修改圖書',
            message: '條碼：' + isbn,
            fields: [
                { name: 'title', label: '書名', value: book.title || '' },
                { name: 'isbn', label: 'ISBN（選填）', value: book.isbn || '' }
            ],
            submitText: '儲存',
            validate: function (v) {
                return v.title.trim() ? '' : '書名不可空白';
            }
        });
        if (result === null) return;
        try {
            const res = await api('PUT', '/api/books/' + encodeURIComponent(isbn), {
                title: result.title.trim(),
                assetId: book.assetId || '',
                isbn: (result.isbn || '').trim()
            });
            bookDatabase[isbn] = res.book;
            renderManageTable();
        } catch (err) { alert('❌ ' + err.message); }
    }

    function renderReportTable() {
        const tbody = document.querySelector('#statTable tbody');
        tbody.innerHTML = Object.keys(bookDatabase).map(isbn => `
            <tr><td>${escapeHtml(bookDatabase[isbn].title)}</td><td>${escapeHtml(bookDatabase[isbn].status)}</td><td>${bookDatabase[isbn].count || 0}次</td></tr>
        `).join('');
    }

    // 報廢為狀態變更（非刪除），資料保留、可還原
    async function deleteBook(isbn) {
        const b = bookDatabase[isbn];
        if (!confirm(`⚠️ 確定要將《${b.title}》標記為報廢？\n（報廢後不可借還，資料仍會保留）`)) return;
        try {
            const res = await api('POST', '/api/books/' + encodeURIComponent(isbn) + '/scrap');
            bookDatabase[isbn] = res.book;
            renderManageTable();
        } catch (err) { alert('❌ ' + err.message); }
    }

    async function restoreBook(isbn) {
        const b = bookDatabase[isbn];
        if (!confirm(`💡 確定要取消《${b.title}》的報廢狀態？`)) return;
        try {
            const res = await api('POST', '/api/books/' + encodeURIComponent(isbn) + '/restore');
            bookDatabase[isbn] = res.book;
            renderManageTable();
        } catch (err) { alert('❌ ' + err.message); }
    }

    bootstrap();
</script>

</body>
</html>
